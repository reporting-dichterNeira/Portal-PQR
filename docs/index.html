<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Piloto estático del Portal PQR">
  <title>Portal PQR · Piloto</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div id="app"></div>
  <template id="login-template">
    <main class="login-shell">
      <section class="login-card">
        <span class="eyebrow">PILOTO · GITHUB PAGES</span>
        <h1>Portal PQR</h1>
        <p>Radicación, validación, redigitación y cierre con trazabilidad.</p>
        <div class="notice">Los datos de esta fase de pruebas se guardan solo en este navegador. No uses información real o sensible.</div>
        <form id="login-form" class="stack">
          <label>Correo <input type="email" id="email" required placeholder="usuario@empresa.com"></label>
          <label>Contraseña <input type="password" id="password" required placeholder="••••••••"></label>
          <button class="primary" type="submit">Ingresar</button>
        </form>
        <details><summary>Credenciales de prueba</summary>
          <div class="demo-grid">
            <button data-demo="admin@empresa.com|Admin123*">Administrador</button>
            <button data-demo="validador@empresa.com|Validador123*">Validador</button>
            <button data-demo="redigitador@empresa.com|Redigitador123*">Redigitación</button>
            <button data-demo="carlos.mendoza@empresa.com|Carlos123*">Comercial</button>
          </div>
        </details>
      </section>
    </main>
  </template>
  <script src="assets/app.js"></script>
</body>
</html>
