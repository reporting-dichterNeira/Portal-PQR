# Autenticación propia dentro de cada función, no la comprobación JWT heredada.
[functions.pqr-admin]
verify_jwt = false

# Endpoint exclusivo del programador: exige x-pqr-mailer-token.
[functions.pqr-mailer]
verify_jwt = false

# Session-gated cache reader; separate receiver authenticates its own secret.
[functions.pqr-audits]
verify_jwt = false

[functions.pqr-audit-sync]
verify_jwt = false
